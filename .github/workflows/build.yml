  name: build
  on:
    workflow_dispatch:
      inputs:
        sha:
          required: false
  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - run: echo "built ${{ github.sha }}" > out.txt
        - uses: actions/upload-artifact@v4
          with:
            name: out
            path: out.txt
